# anylearn.vn nginx configuration — PHP FALLBACK (emergency rollback)
# Dùng khi cần revert toàn bộ / về PHP portal cũ.
# Xem rollback-to-php.sh để switch nhanh.

upstream anylearn_frontend {
    server 127.0.0.1:3000;
}

upstream anylearn_backend {
    server 127.0.0.1:8080;
}

upstream anylearn_php {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name anylearn.vn www.anylearn.vn;

    # SSL/HTTPS (uncomment and configure when ready)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/anylearn.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/anylearn.vn/privkey.pem;

    client_max_body_size 25M;

    access_log /var/log/nginx/anylearn_access.log;
    error_log  /var/log/nginx/anylearn_error.log;

    # ── Java API vẫn hoạt động ─────────────────────────────────────────────────
    location /v2/ {
        proxy_pass http://anylearn_backend/v2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Toàn bộ / → PHP portal (fallback) ─────────────────────────────────────
    location / {
        proxy_pass http://anylearn_php;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_cookie_path / /;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
