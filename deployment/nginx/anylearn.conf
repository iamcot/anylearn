# anylearn.vn nginx configuration

upstream anylearn_frontend {
    server 127.0.0.1:3000;
}

upstream anylearn_backend {
    server 127.0.0.1:8080;
}

upstream anylearn_php {
    server 127.0.0.1:8000;
}

# HTTP → HTTPS redirect (uncomment after SSL is configured)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name anylearn.vn www.anylearn.vn;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name anylearn.vn www.anylearn.vn;

    # SSL/HTTPS (uncomment and configure when ready)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/anylearn.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/anylearn.vn/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;

    access_log /var/log/nginx/anylearn_access.log;
    error_log  /var/log/nginx/anylearn_error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Payment callbacks ──────────────────────────────────────────────────────
    # Gateway đã đăng ký URL không có /v2. Nginx rewrite thêm /v2 trước khi
    # forward sang Java backend (port 8080, context-path=/v2).
    location /payment-notify/ {
        proxy_pass http://anylearn_backend/v2/payment-notify/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /payment-return/ {
        proxy_pass http://anylearn_backend/v2/payment-return/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Java API (context-path /v2) ────────────────────────────────────────────
    location /v2/ {
        proxy_pass http://anylearn_backend/v2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── PHP Admin (Laravel portal, giữ nguyên) ─────────────────────────────────
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://anylearn_php/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_cookie_path / /;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Admin static assets (^~ prevents regex location override)
    location ^~ /admin/css/ {
        proxy_pass http://anylearn_php/css/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location ^~ /admin/js/ {
        proxy_pass http://anylearn_php/js/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location ^~ /admin/img/ {
        proxy_pass http://anylearn_php/img/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Next.js static assets (long-lived cache) ───────────────────────────────
    location /_next/static/ {
        proxy_pass http://anylearn_frontend/_next/static/;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Next.js frontend (catch-all) ───────────────────────────────────────────
    location / {
        proxy_pass http://anylearn_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }
}
