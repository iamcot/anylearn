upstream anylearn_frontend {
    server 127.0.0.1:3000;
}

upstream anylearn_backend {
    server 127.0.0.1:8080;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name anylearn.vn www.anylearn.vn api.anylearn.vn;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name anylearn.vn www.anylearn.vn;

    # SSL — managed by Certbot
    ssl_certificate /etc/letsencrypt/live/anylearn.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anylearn.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    access_log /var/log/nginx/anylearn_access.log;
    error_log  /var/log/nginx/anylearn_error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Payment callbacks (rewrite → /v2/) ────────────────────────────────────
    location /payment-notify/ {
        proxy_pass http://anylearn_backend/v2/payment-notify/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /payment-return/ {
        proxy_pass http://anylearn_backend/v2/payment-return/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── SSE (notification stream — phải đứng trước /v2/ để override) ────────────
    location = /v2/api/user/notification/stream {
        proxy_pass http://anylearn_backend/v2/api/user/notification/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    # ── Java API (/v2/) ───────────────────────────────────────────────────────
    location /v2/ {
        proxy_pass http://anylearn_backend/v2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Admin SPA (Vite build — served as static files) ──────────────────────
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /opt/anylearn/admin/current/;
        try_files $uri $uri/ /admin/index.html;

        # index.html must never be cached (references hashed asset filenames)
        location = /admin/index.html {
            alias /opt/anylearn/admin/current/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }

    # Long-lived cache for Vite's content-hashed assets
    location ~* ^/admin/assets/ {
        alias /opt/anylearn/admin/current/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Next.js static ────────────────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://anylearn_frontend/_next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Next.js frontend (catch-all) ─────────────────────────────────────────
    location / {
        proxy_pass http://anylearn_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }
}
